<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d23"><title>Groepsspel online</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/show-style.css">
<style>
main{max-width:920px;margin:0 auto;padding:24px 18px 60px}h1{font-size:clamp(30px,6vw,52px);margin:10px 0}.lead{font-size:18px;line-height:1.6;color:#d9d6ef}
.box{border:1px solid #676aa34d;border-radius:16px;padding:20px;margin:16px 0;background:#ffffff08}.box h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.grid a{display:block;border:1px solid #676aa366;border-radius:12px;padding:14px;color:#f5f2ff;text-decoration:none;background:#ffffff0a}.grid a b{display:block;font-size:17px}.grid a small{color:#b7b3d6}
.btn{display:inline-block;background:#ffd46b;color:#2b2138;border:0;border-radius:12px;padding:14px 20px;font-weight:800;font-size:16px;text-decoration:none;cursor:pointer}.btn.ghost{background:transparent;color:#f5f2ff;border:1px solid #676aa3}
input{font-size:22px;letter-spacing:5px;text-transform:uppercase;padding:12px;border-radius:10px;border:1px solid #676aa3;background:#0d1330;color:#fff;width:11ch}
.code{font-size:44px;letter-spacing:10px;font-weight:900;color:#ffd46b}.qr{background:#fff;padding:12px;display:inline-block;border-radius:12px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.warn{color:#ffb4c0}.small{font-size:13px;color:#b7b3d6;line-height:1.5}.mono{font-family:ui-monospace,monospace;word-break:break-all;font-size:13px}
</style><script defer src="/app/gs-i18n.js"></script><script defer src="/qr.js"></script><script defer src="/online.js"></script></head>
<body><header><a href="/">✦ groepsspel</a><span id="connection">online</span></header><main id="root"><p>Laden…</p></main></body></html>
